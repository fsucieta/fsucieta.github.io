<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a"/>
  <defs>
    <linearGradient id="grad21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid21" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b8860b" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#grad21)"/>
  <rect width="1200" height="675" fill="url(#grid21)"/>
  
  <!-- Decorative Accent Line -->
  <line x1="80" y1="180" x2="280" y2="180" stroke="#b8860b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Tag -->
  <text x="80" y="230" fill="#b8860b" font-family="Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="3">REGISTRE RBE & TRACFIN</text>
  
  <!-- Title -->
  <text x="80" y="320" fill="#ffffff" font-family="Georgia, serif" font-size="42" font-weight="bold">Sociétés Écrans et Opacité des Holdings</text>
  
  <!-- Sub-badge -->
  <rect x="80" y="420" width="450" height="60" rx="10" fill="rgba(255,255,255,0.06)" stroke="#b8860b" stroke-width="1.5"/>
  <text x="110" y="458" fill="#b8860b" font-family="monospace" font-size="20" font-weight="bold">ENQUÊTE D'INVESTIGATION #21 • PROPUBLICA</text>
  
  <!-- Watermark logo seal -->
  <circle cx="1020" cy="337" r="180" fill="none" stroke="#b8860b" stroke-width="2" opacity="0.25"/>
  <text x="1020" y="347" text-anchor="middle" fill="#b8860b" font-family="Georgia, serif" font-size="32" font-weight="bold" opacity="0.4">CASA DI CRISTALE</text>
</svg>